version: 2

updates:
  # Bun monorepo dependencies
  - package-ecosystem: "bun"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"

    # 避免一次产生太多 PR
    open-pull-requests-limit: 5

    # minor / patch 合并为一个 PR
    # major 保持独立 PR，方便单独 review
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

    commit-message:
      prefix: "chore"
      include: "scope"

    labels:
      - "dependencies"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Asia/Tokyo"

    # Actions 通常一起升级即可
    groups:
      actions:
        patterns:
          - "*"

    commit-message:
      prefix: "ci"
      include: "scope"

    labels:
      - "dependencies"
