name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Check types and Worker bindings
        run: bun run typecheck

      - name: Test game data
        run: bun test packages/game-data/src/index.test.ts

      - name: Test NPC release manifest
        run: bun run validate:npc-census && bun run test:npc-manifest

      - name: Test game engine
        run: bun --cwd packages/game-engine test

      - name: Test web application
        run: bun --cwd apps/web test

      - name: Test Worker
        run: bun run test:worker

      - name: Build web application and Worker
        run: bun run build
