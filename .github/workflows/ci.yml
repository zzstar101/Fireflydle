name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 便宜且容易失败的检查前置：Worker types 过期会立即暴露，而不是混在 typecheck 里
      - name: Check generated Worker types
        run: bun run worker:types:check

      - name: Check formatting
        run: bun run format:check

      - name: TypeScript typecheck
        run: bun run typecheck

      # 昂贵的运行时素材生成放到便宜检查之后
      - name: Generate and validate runtime assets
        run: bun run assets:build && bun run assets:validate

      - name: Test game data
        run: bun --cwd packages/game-data test

      - name: Test NPC release manifest
        run: bun run validate:npc-census && bun run test:npc-manifest

      - name: Test game engine
        run: bun --cwd packages/game-engine test

      - name: Test web application
        run: bun --cwd apps/web test

      - name: Test Worker
        run: bun run test:worker

      - name: Build web application and Worker
        run: bun run build
