name: Deploy production

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build_release:
    name: Synchronize, verify, and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pages: read

    env:
      VITE_API_URL: https://api.fireflydle.games
      VITE_ASSET_BASE_URL: ${{ vars.VITE_ASSET_BASE_URL || 'https://assets.fireflydle.games' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify released commit belongs to main
        if: github.event_name == 'release'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate player-facing release announcement
        if: github.event_name == 'release'
        env:
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ANNOUNCEMENT_TOKEN: ${{ secrets.RELEASE_ANNOUNCEMENT_TOKEN }}
        run: |
          if [ -z "${RELEASE_ANNOUNCEMENT_TOKEN:-}" ]; then
            echo "::error::RELEASE_ANNOUNCEMENT_TOKEN is not configured."
            exit 1
          fi
          bun scripts/extract-release-announcement.ts release-announcement.json

      - name: Synchronize character data and assets
        run: bun run sync:data

      - name: Check synchronized output
        run: |
          test -s apps/web/public/assets/manifest.json
          test -s apps/web/public/assets/manifest.sha256
          test -s packages/game-data/generated/characters.sql
          test -s packages/game-data/src/generated/content-manifest.json
          (cd apps/web/public/assets && sha256sum --check manifest.sha256)

      - name: Check formatting
        run: bun run format:check

      - name: Check types and Worker bindings
        run: bun run typecheck

      - name: Test game data
        run: bun test packages/game-data/src/index.test.ts

      - name: Test NPC release manifest
        run: bun run validate:npc-census && bun run test:npc-manifest

      - name: Test game engine
        run: bun --cwd packages/game-engine test

      - name: Test web application
        run: bun --cwd apps/web test

      - name: Test Worker
        run: bun run test:worker

      - name: Build web application and Worker
        run: bun run build

      - name: Validate production asset set
        run: bun run assets:validate

      - name: Upload runtime assets to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
        run: bun run assets:upload

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/web/dist
          retention-days: 30

      - name: Preserve synchronized release data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/public/assets/manifest.json
            apps/web/public/assets/manifest.sha256
            packages/game-data/generated/characters.sql
            packages/game-data/src/generated/characters.json
            packages/game-data/src/generated/content-manifest.json
            packages/game-data/src/generated/factions.json
            packages/game-data/src/generated/versions.json
            packages/game-data/src/generated/sync-metadata.json
            packages/game-data/src/data/playable-shell.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve release announcement
        if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-announcement-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-announcement.json
          if-no-files-found: error
          retention-days: 30

  deploy_api:
    name: Migrate data and deploy API
    needs: build_release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production-api
      url: https://api.fireflydle.games

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download synchronized release data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Verify Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::production-api is missing CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::production-api is missing CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi

      - name: Report Worker secret configuration
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Cloudflare Email Service uses the EMAIL send_email binding; no mail API secret is required."
          if bunx wrangler secret list --format json | jq --exit-status 'any(.[]; .name == "CLOUDFLARE_ANALYTICS_TOKEN")'; then
            echo "Operations analytics is configured."
          else
            echo "::warning::CLOUDFLARE_ANALYTICS_TOKEN is not configured; latency and quota panels remain unavailable."
          fi
          if bunx wrangler secret list --format json | jq --exit-status 'any(.[]; .name == "RELEASE_ANNOUNCEMENT_TOKEN")'; then
            echo "Release announcement publishing is configured."
          else
            echo "::error::RELEASE_ANNOUNCEMENT_TOKEN is not configured on the Worker."
            exit 1
          fi
          if bunx wrangler secret list --format json | jq --exit-status 'any(.[]; .name == "GITHUB_ISSUE_TOKEN")'; then
            echo "Feedback publishing to GitHub Issues is configured."
          else
            echo "::error::GITHUB_ISSUE_TOKEN is not configured on the Worker."
            exit 1
          fi

      - name: Apply D1 migrations
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler d1 migrations apply fireflydle --remote

      - name: Synchronize production characters
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          bunx wrangler d1 execute fireflydle --remote
          --file ../../packages/game-data/generated/characters.sql

      - name: Deploy Worker and Durable Object migrations
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          workingDirectory: apps/api
          wranglerVersion: "4.118.0"
          command: deploy

      - name: Verify production API
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 5 --retry-delay 3 --retry-all-errors
          https://api.fireflydle.games/api/health

  deploy_pages:
    name: Deploy GitHub Pages
    needs:
      - build_release
      - deploy_api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

  publish_announcement:
    name: Publish release announcement
    if: github.event_name == 'release'
    needs:
      - build_release
      - deploy_api
      - deploy_pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Download release announcement
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-announcement-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Publish player-facing announcement
        env:
          RELEASE_ANNOUNCEMENT_TOKEN: ${{ secrets.RELEASE_ANNOUNCEMENT_TOKEN }}
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 3 --retry-delay 3 --retry-all-errors
          -H "Authorization: Bearer ${RELEASE_ANNOUNCEMENT_TOKEN}"
          -H "Content-Type: application/json"
          --data-binary @release-announcement.json
          https://api.fireflydle.games/api/announcements/releases
