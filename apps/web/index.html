<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07101d" />
    <meta
      name="description"
      content="萤一把 Fireflydle——每日一局、无限随机与实时对战的崩坏：星穹铁道角色猜谜。"
    />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="168x168" />
    <link rel="apple-touch-icon" href="/favicon.png" sizes="168x168" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>萤一把 · Fireflydle</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        // GitHub Pages 的 404 入口会暂存原始路径；在 React 启动前恢复，避免深链接停留在查询参数上。
        const url = new URL(window.location.href);
        const target = url.searchParams.get("__fireflydle_path");
        if (target?.startsWith("/") && !target.startsWith("//")) {
          window.history.replaceState(null, "", target);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
