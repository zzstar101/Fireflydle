<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>萤一把 · 重设计原型「萤光」</title>
    <style>
      /* =========================================================
   萤一把 · Redesign prototype "萤光 / Lumen"
   原则：界面单色，颜色只属于判题；萤光绿 = 猜中 = 品牌。
   ========================================================= */
      :root {
        --sans:
          "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC",
          system-ui, sans-serif;
        --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;

        --bg: #0b0c0e;
        --bg-2: #111316;
        --bg-3: #171a1e;
        --line: rgb(255 255 255 / 7%);
        --line-2: rgb(255 255 255 / 13%);
        --text: #ecedef;
        --muted: #8f949b;
        --faint: #5d6269;

        --lit: #4fe3a3; /* 萤光：唯一品牌色，同时也是“一致” */
        --lit-rgb: 79 227 163;
        --lit-ink: #03150c;
        --near: #f0b44c; /* 接近 */
        --near-ink: #1f1402;
        --miss: #1b1e22; /* 不符 */
        --miss-ink: #80858c;
        --danger: #ff6b6b;

        --glow: 0 0 0 1px rgb(var(--lit-rgb) / 55%), 0 10px 32px -10px rgb(var(--lit-rgb) / 70%);
        --r: 14px;
        --r-tile: 10px;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --nav-h: 60px;
      }
      :root[data-theme="light"] {
        --bg: #f1f2f0;
        --bg-2: #ffffff;
        --bg-3: #e7e9e6;
        --line: rgb(12 14 16 / 8%);
        --line-2: rgb(12 14 16 / 15%);
        --text: #0e1012;
        --muted: #5d636a;
        --faint: #9a9fa5;
        --lit: #2fcf89;
        --lit-rgb: 47 207 137;
        --lit-ink: #04170d;
        --near: #f2b13f;
        --near-ink: #231602;
        --miss: #e2e4e1;
        --miss-ink: #6b7178;
        --glow: 0 0 0 1px rgb(var(--lit-rgb) / 60%), 0 10px 26px -12px rgb(var(--lit-rgb) / 80%);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 15px/1.55 var(--sans);
        -webkit-font-smoothing: antialiased;
        min-height: 100dvh;
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .num {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }
      :focus-visible {
        outline: 2px solid var(--lit);
        outline-offset: 2px;
        border-radius: 6px;
      }

      /* ---------- Top bar ---------- */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        height: var(--nav-h);
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        padding: 0 24px;
        background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(14px) saturate(140%);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: inline-flex;
        align-items: baseline;
        gap: 2px;
        font-weight: 900;
        font-size: 19px;
        letter-spacing: 0.02em;
      }
      .fly {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--lit);
        box-shadow: 0 0 10px 2px rgb(var(--lit-rgb) / 70%);
        transform: translateY(-1px);
        margin-left: 3px;
        animation: breathe 3.6s ease-in-out infinite;
      }
      @keyframes breathe {
        50% {
          opacity: 0.45;
          box-shadow: 0 0 4px 1px rgb(var(--lit-rgb) / 40%);
        }
      }
      .tabs {
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: var(--bg-2);
        border: 1px solid var(--line);
      }
      .tabs button {
        border: 0;
        background: transparent;
        padding: 6px 16px;
        border-radius: 999px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
        transition:
          color 0.15s,
          background 0.15s;
      }
      .tabs button:hover {
        color: var(--text);
      }
      .tabs button[aria-current="page"] {
        background: var(--text);
        color: var(--bg);
      }
      .tools {
        justify-self: end;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
      }
      .icon-btn:hover {
        color: var(--text);
        background: var(--bg-2);
        border-color: var(--line);
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
      }
      .me {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px 4px 4px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      .me img {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        background: var(--bg-3);
      }

      /* mobile bottom tabbar */
      .tabbar {
        display: none;
      }

      /* ---------- Generic ---------- */
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 0 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 46px;
        padding: 0 22px;
        border-radius: 999px;
        border: 1px solid var(--line-2);
        background: transparent;
        font-weight: 700;
        font-size: 15px;
        white-space: nowrap;
        transition:
          transform 0.12s var(--ease),
          background 0.15s,
          border-color 0.15s;
      }
      .btn:hover {
        border-color: var(--text);
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }
      .btn-primary:hover {
        background: color-mix(in srgb, var(--text) 88%, var(--lit));
      }
      .btn svg {
        width: 17px;
        height: 17px;
      }
      .label {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .chip {
        justify-self: start;
        align-self: start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 24px;
        padding: 0 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: var(--bg-3);
        color: var(--muted);
      }
      .chip.live {
        color: var(--lit);
        background: rgb(var(--lit-rgb) / 12%);
      }
      .chip.live::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--lit);
        box-shadow: 0 0 8px var(--lit);
      }
      .chip.warn {
        color: var(--near);
        background: color-mix(in srgb, var(--near) 14%, transparent);
      }

      /* ---------- HUB ---------- */
      .hub {
        padding-block: 36px 120px;
      }
      .bento {
        display: grid;
        gap: 14px;
        grid-template-columns: 1.55fr 1fr;
        grid-template-rows: auto auto;
      }
      .today {
        grid-row: span 2;
        position: relative;
        overflow: hidden;
        border-radius: 22px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        min-height: 440px;
      }
      .today-copy {
        padding: 34px 34px 30px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        position: relative;
        z-index: 2;
      }
      .today h1 {
        font-size: clamp(40px, 5.2vw, 64px);
        line-height: 1.02;
        letter-spacing: -0.03em;
        font-weight: 900;
        margin: 6px 0 0;
      }
      .today .sub {
        color: var(--muted);
        margin: 0;
        max-width: 26ch;
        font-size: 16px;
      }
      .today .cta {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: auto;
      }
      .today-meta {
        display: flex;
        gap: 28px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .today-meta div {
        display: grid;
        gap: 2px;
      }
      .today-meta strong {
        font-size: 22px;
        font-weight: 800;
      }
      .mini-board {
        display: grid;
        grid-template-columns: repeat(6, 14px);
        gap: 4px;
      }
      .mini-board i {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: var(--bg-3);
        border: 1px solid var(--line);
      }

      .yesterday {
        position: relative;
        isolation: isolate;
        border-left: 1px solid var(--line);
        background: var(--bg-3);
      }
      .yesterday img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 12%;
        z-index: -1;
        -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
        mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
      }
      .yesterday::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(90deg, var(--bg-2) 0%, transparent 28%);
      }
      .yesterday figcaption {
        position: absolute;
        left: 22px;
        right: 22px;
        bottom: 20px;
        display: grid;
        gap: 4px;
      }
      .yesterday figcaption strong {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.01em;
      }
      .yesterday figcaption .label {
        color: var(--muted);
      }

      .side-tile {
        border-radius: 22px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        padding: 24px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 14px;
        min-height: 213px;
        transition:
          border-color 0.2s,
          transform 0.2s var(--ease);
      }
      .side-tile:hover {
        border-color: var(--line-2);
        transform: translateY(-2px);
      }
      .side-tile h2 {
        font-size: 26px;
        font-weight: 900;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .side-tile p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .side-tile .row {
        display: flex;
        justify-content: space-between;
        align-items: end;
      }
      .lives {
        display: flex;
        gap: 6px;
      }
      .lives i {
        width: 12px;
        height: 22px;
        border-radius: 4px;
        background: var(--lit);
        box-shadow: 0 0 10px rgb(var(--lit-rgb) / 50%);
      }
      .lives i.off {
        background: var(--bg-3);
        box-shadow: none;
      }
      .bignum {
        font-size: 34px;
        font-weight: 800;
        line-height: 1;
      }
      .arrow {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        border: 1px solid var(--line-2);
      }
      .arrow svg {
        width: 18px;
        height: 18px;
      }
      .side-tile:hover .arrow {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }

      .section-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin: 52px 0 14px;
      }
      .section-title h3 {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
      }
      .more {
        border-top: 1px solid var(--line);
      }
      .more a {
        display: grid;
        grid-template-columns: 56px 1fr auto 40px;
        gap: 18px;
        align-items: center;
        padding: 16px 4px;
        border-bottom: 1px solid var(--line);
        transition:
          background 0.15s,
          padding 0.2s var(--ease);
      }
      .more a:hover {
        background: var(--bg-2);
        padding-left: 14px;
      }
      .more .thumb {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        overflow: hidden;
        background: var(--bg-3);
      }
      .more .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .more strong {
        font-size: 17px;
        font-weight: 800;
        display: block;
      }
      .more small {
        color: var(--muted);
        font-size: 13px;
      }
      .more .chip {
        align-self: center;
      }

      .week {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 10px;
      }
      .day {
        border-radius: 14px;
        background: var(--bg-2);
        border: 1px solid var(--line);
        padding: 12px;
        display: grid;
        gap: 10px;
      }
      .day .label {
        display: flex;
        justify-content: space-between;
      }
      .day .res {
        font-size: 20px;
        font-weight: 800;
      }
      .day.won .res {
        color: var(--lit);
      }
      .day.lost .res {
        color: var(--faint);
      }
      .day.is-today {
        border-color: var(--line-2);
      }
      .day .bar {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 3px;
      }
      .day .bar i {
        height: 6px;
        border-radius: 2px;
        background: var(--bg-3);
      }
      .day .bar i.e {
        background: var(--lit);
      }
      .day .bar i.c {
        background: var(--near);
      }
      .day .bar i.m {
        background: var(--miss-ink);
        opacity: 0.45;
      }

      /* ---------- GAME ---------- */
      .game {
        padding-block: 26px 140px;
      }
      .game-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 18px;
        align-items: end;
        margin-bottom: 22px;
      }
      .game-head .crumbs {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }
      .game-head h1 {
        margin: 6px 0 0;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      .status {
        display: flex;
        gap: 22px;
        align-items: center;
      }
      .pips {
        display: flex;
        gap: 5px;
      }
      .pips i {
        width: 9px;
        height: 22px;
        border-radius: 3px;
        background: var(--bg-3);
        border: 1px solid var(--line-2);
        transition: background 0.3s;
      }
      .pips i.used {
        background: var(--text);
        border-color: transparent;
        opacity: 0.35;
      }
      .pips i.win {
        background: var(--lit);
        box-shadow: 0 0 10px rgb(var(--lit-rgb) / 60%);
        opacity: 1;
      }
      .timer {
        font-size: 22px;
        font-weight: 700;
      }

      .board {
        --cols: 190px repeat(6, minmax(0, 1fr));
        display: grid;
        gap: 8px;
      }
      .board-head,
      .row {
        display: grid;
        grid-template-columns: var(--cols);
        gap: 8px;
      }
      .board-head span {
        font-size: 12px;
        font-weight: 700;
        color: var(--faint);
        text-align: center;
        padding-bottom: 2px;
      }
      .board-head span:first-child {
        text-align: left;
        padding-left: 4px;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        padding: 6px 10px 6px 6px;
        border-radius: var(--r-tile);
        background: var(--bg-2);
        border: 1px solid var(--line);
      }
      .who img {
        width: 50px;
        height: 50px;
        border-radius: 8px;
        object-fit: cover;
        background: var(--bg-3);
        flex: none;
      }
      .who b {
        display: block;
        font-size: 15px;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .who small {
        display: block;
        font-size: 11px;
        color: var(--faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tile {
        position: relative;
        height: 64px;
        border-radius: var(--r-tile);
        display: grid;
        place-items: center;
        text-align: center;
        padding: 4px 6px;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.15;
        background: var(--miss);
        color: var(--miss-ink);
        transform-style: preserve-3d;
      }
      .tile .v {
        display: inline-flex;
        align-items: center;
        gap: 3px;
      }
      .tile .dir {
        font-size: 13px;
        font-weight: 900;
      }
      .tile[data-s="exact"] {
        background: var(--lit);
        color: var(--lit-ink);
        box-shadow: var(--glow);
      }
      .tile[data-s="close"] {
        background: var(--near);
        color: var(--near-ink);
        background-image: repeating-linear-gradient(
          135deg,
          rgb(0 0 0 / 0%) 0 7px,
          rgb(0 0 0 / 7%) 7px 9px
        );
      }
      .tile[data-s="miss"] {
        box-shadow: inset 0 0 0 1px var(--line);
      }
      /* non-color cue: corner glyph */
      .tile::after {
        position: absolute;
        top: 5px;
        right: 7px;
        font-size: 10px;
        font-weight: 900;
        opacity: 0.7;
      }
      .tile[data-s="exact"]::after {
        content: "✓";
      }
      .tile[data-s="close"]::after {
        content: "≈";
      }

      .row.empty .slot {
        height: 64px;
        border-radius: var(--r-tile);
        border: 1px dashed var(--line-2);
        opacity: 0.55;
      }
      .row.empty .slot:first-child {
        border-style: solid;
      }

      /* reveal animation */
      .row.reveal .tile {
        animation: flip 0.52s var(--ease) both;
        animation-delay: calc(var(--i) * 110ms);
      }
      .row.reveal .tile[data-s="exact"] {
        animation:
          flip 0.52s var(--ease) both,
          lit 1.1s ease-out both;
        animation-delay: calc(var(--i) * 110ms), calc(var(--i) * 110ms + 0.35s);
      }
      .row.reveal .who {
        animation: slidein 0.35s var(--ease) both;
      }
      @keyframes flip {
        0% {
          transform: rotateX(90deg);
          background: var(--bg-3);
          color: transparent;
          box-shadow: none;
        }
        45% {
          transform: rotateX(90deg);
        }
        100% {
          transform: rotateX(0);
        }
      }
      @keyframes lit {
        0% {
          box-shadow: 0 0 0 0 rgb(var(--lit-rgb) / 0%);
        }
        30% {
          box-shadow:
            0 0 0 3px rgb(var(--lit-rgb) / 45%),
            0 0 42px 6px rgb(var(--lit-rgb) / 55%);
        }
        100% {
          box-shadow: var(--glow);
        }
      }
      @keyframes slidein {
        from {
          opacity: 0;
          transform: translateX(-8px);
        }
      }
      .row.win .tile {
        animation: winrun 0.9s var(--ease) both;
        animation-delay: calc(var(--i) * 70ms + 0.9s);
      }
      @keyframes winrun {
        40% {
          transform: translateY(-6px);
          box-shadow:
            0 0 0 2px rgb(var(--lit-rgb) / 70%),
            0 0 48px 10px rgb(var(--lit-rgb) / 60%);
        }
      }
      .row.shake {
        animation: shake 0.36s;
      }
      @keyframes shake {
        25% {
          transform: translateX(-5px);
        }
        75% {
          transform: translateX(5px);
        }
      }

      /* composer = the active row */
      .row.active {
        position: relative;
      }
      .composer {
        grid-column: 1 / -1;
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 64px;
        padding: 0 8px 0 18px;
        border-radius: var(--r-tile);
        background: var(--bg-2);
        border: 1px solid var(--line-2);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .composer:focus-within {
        border-color: rgb(var(--lit-rgb) / 70%);
        box-shadow: 0 0 0 4px rgb(var(--lit-rgb) / 12%);
      }
      .composer svg {
        width: 19px;
        height: 19px;
        color: var(--faint);
        flex: none;
      }
      .composer input {
        flex: 1;
        min-width: 0;
        height: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        font-size: 17px;
        font-weight: 600;
      }
      .composer input::-webkit-search-cancel-button {
        display: none;
      }
      .composer input::placeholder {
        color: var(--faint);
        font-weight: 500;
      }
      .composer kbd {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--faint);
        border: 1px solid var(--line-2);
        border-radius: 6px;
        padding: 2px 6px;
      }
      .composer .btn {
        height: 46px;
      }
      .results {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        z-index: 10;
        max-height: 340px;
        overflow: auto;
        padding: 6px;
        background: var(--bg-2);
        border: 1px solid var(--line-2);
        border-radius: var(--r);
        box-shadow: 0 24px 60px -20px rgb(0 0 0 / 60%);
      }
      .results button {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px;
        border: 0;
        background: transparent;
        border-radius: 10px;
        text-align: left;
      }
      .results button[aria-selected="true"] {
        background: var(--bg-3);
      }
      .results img {
        width: 38px;
        height: 38px;
        border-radius: 8px;
        object-fit: cover;
      }
      .results b {
        font-weight: 800;
      }
      .results small {
        display: block;
        color: var(--faint);
        font-size: 12px;
      }
      .results .used {
        opacity: 0.35;
        pointer-events: none;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 13px;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .legend i {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        display: inline-block;
      }

      /* ---------- Result sheet ---------- */
      .scrim {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgb(0 0 0 / 55%);
        backdrop-filter: blur(6px);
        display: grid;
        place-items: center;
        padding: 20px;
        animation: fade 0.3s both;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      .sheet {
        width: min(760px, 100%);
        max-height: calc(100dvh - 40px);
        overflow: auto;
        border-radius: 26px;
        background: var(--bg-2);
        border: 1px solid var(--line-2);
        display: grid;
        grid-template-columns: 300px 1fr;
        animation: rise 0.5s var(--ease) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.98);
        }
      }
      .sheet-art {
        position: relative;
        min-height: 420px;
        background: var(--bg-3);
        overflow: hidden;
        border-radius: 26px 0 0 26px;
      }
      .sheet-art img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 10%;
      }
      .sheet-art::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, var(--bg-2) 0%, transparent 45%);
      }
      .sheet-art figcaption {
        position: absolute;
        z-index: 2;
        left: 22px;
        bottom: 18px;
      }
      .sheet-art figcaption strong {
        display: block;
        font-size: 30px;
        font-weight: 900;
      }
      .sheet-body {
        padding: 30px;
        display: grid;
        gap: 22px;
        align-content: start;
      }
      .sheet-body h2 {
        margin: 0;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }
      .sheet-body h2 em {
        font-style: normal;
        color: var(--lit);
      }
      .share-grid {
        display: grid;
        gap: 4px;
      }
      .share-grid div {
        display: grid;
        grid-template-columns: repeat(6, 18px);
        gap: 4px;
      }
      .share-grid i {
        height: 18px;
        border-radius: 4px;
        background: var(--miss);
        box-shadow: inset 0 0 0 1px var(--line-2);
      }
      .share-grid i.e {
        background: var(--lit);
        box-shadow: none;
      }
      .share-grid i.c {
        background: var(--near);
        box-shadow: none;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1px;
        background: var(--line);
        border-radius: 14px;
        overflow: hidden;
      }
      .stats div {
        background: var(--bg-2);
        padding: 12px 14px;
        display: grid;
        gap: 2px;
      }
      .stats strong {
        font-size: 22px;
        font-weight: 800;
      }
      .funnel {
        display: grid;
        gap: 6px;
      }
      .funnel-row {
        display: grid;
        grid-template-columns: 54px 1fr 40px;
        gap: 10px;
        align-items: center;
        font-size: 13px;
        color: var(--muted);
      }
      .funnel-row .track {
        height: 8px;
        border-radius: 99px;
        overflow: hidden;
      }
      .funnel-row .track i {
        display: block;
        height: 100%;
        border-radius: 99px;
        background: var(--muted);
        opacity: 0.5;
        transform-origin: left;
        animation: grow 0.8s var(--ease) both;
      }
      .funnel-row.last .track i {
        background: var(--lit);
        opacity: 1;
      }
      @keyframes grow {
        from {
          transform: scaleX(0);
        }
      }
      .sheet .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .sheet .close {
        position: absolute;
        top: 14px;
        right: 14px;
      }

      /* fireflies (win only) */
      .flies {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 39;
        overflow: hidden;
      }
      .flies i {
        position: absolute;
        bottom: -10px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--lit);
        box-shadow: 0 0 12px 3px rgb(var(--lit-rgb) / 70%);
        animation: drift var(--d) ease-out var(--delay) both;
      }
      @keyframes drift {
        0% {
          transform: translate(0, 0);
          opacity: 0;
        }
        15% {
          opacity: 1;
        }
        100% {
          transform: translate(var(--x), -88vh);
          opacity: 0;
        }
      }

      /* ---------- Proto chrome ---------- */
      .proto-bar {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        z-index: 50;
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 999px;
        background: #000;
        color: #fff;
        border: 1px solid rgb(255 255 255 / 15%);
        font-size: 12px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 40%);
      }
      .proto-bar button {
        border: 0;
        background: transparent;
        color: #aaa;
        padding: 7px 12px;
        border-radius: 999px;
        font-weight: 700;
      }
      .proto-bar button.on {
        background: #fff;
        color: #000;
      }

      [hidden] {
        display: none !important;
      }

      /* ---------- Mobile ---------- */
      @media (max-width: 760px) {
        :root {
          --nav-h: 54px;
        }
        .topbar {
          grid-template-columns: 1fr auto;
          padding: 0 16px;
        }
        .topbar .tabs,
        .tools .hide-m {
          display: none;
        }
        .wrap {
          padding: 0 14px;
        }
        .tabbar {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          position: fixed;
          left: 0;
          right: 0;
          bottom: 0;
          z-index: 30;
          padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
          background: color-mix(in srgb, var(--bg) 88%, transparent);
          backdrop-filter: blur(14px);
          border-top: 1px solid var(--line);
        }
        .tabbar button {
          border: 0;
          background: none;
          display: grid;
          justify-items: center;
          gap: 2px;
          padding: 6px 0;
          color: var(--faint);
          font-size: 11px;
          font-weight: 700;
        }
        .tabbar svg {
          width: 21px;
          height: 21px;
        }
        .tabbar button[aria-current="page"] {
          color: var(--text);
        }
        .proto-bar {
          bottom: auto;
          top: 62px;
          left: auto;
          right: 10px;
          transform: none;
        }

        .hub {
          padding-top: 16px;
        }
        .proto-bar button {
          white-space: nowrap;
          padding: 7px 10px;
        }
        .bento {
          grid-template-columns: 1fr;
        }
        .today {
          grid-template-columns: 1fr;
          grid-row: auto;
          min-height: 0;
        }
        .today-copy {
          padding: 22px;
          gap: 14px;
        }
        .yesterday {
          order: -1;
          height: 210px;
          border-left: 0;
          border-bottom: 1px solid var(--line);
        }
        .yesterday::after {
          background: linear-gradient(0deg, var(--bg-2) 0%, transparent 55%);
        }
        .side-tile {
          min-height: 0;
          padding: 20px;
        }
        .more a {
          grid-template-columns: 48px 1fr 32px;
        }
        .more .chip {
          display: none;
        }
        .more .thumb {
          width: 48px;
          height: 48px;
        }
        .week {
          grid-template-columns: repeat(7, minmax(0, 1fr));
          gap: 6px;
        }
        .day {
          padding: 8px 6px;
          gap: 6px;
        }
        .day .res {
          font-size: 15px;
        }
        .day .label span:last-child {
          display: none;
        }

        .game {
          padding-block: 14px 170px;
        }
        .game-head {
          grid-template-columns: 1fr;
          gap: 10px;
          margin-bottom: 14px;
        }
        .game-head h1 {
          font-size: 26px;
        }
        .status {
          justify-content: space-between;
        }
        .board {
          --cols: 44px repeat(6, minmax(0, 1fr));
          gap: 5px;
        }
        .board-head,
        .row {
          gap: 4px;
        }
        .board-head span {
          font-size: 10px;
        }
        .board-head span:first-child {
          visibility: hidden;
        }
        .who {
          padding: 0;
          border: 0;
          background: none;
        }
        .who img {
          width: 44px;
          height: 48px;
          border-radius: 8px;
        }
        .who div {
          display: none;
        }
        .tile,
        .row.empty .slot {
          height: 48px;
          border-radius: 8px;
        }
        .tile {
          font-size: 11px;
          padding: 2px;
        }
        .tile .dir {
          font-size: 11px;
        }
        .tile::after {
          top: 2px;
          right: 4px;
          font-size: 8px;
        }
        .row.active {
          grid-template-columns: 1fr;
        }
        .row.active .composer {
          position: fixed;
          left: 10px;
          right: 10px;
          bottom: calc(66px + env(safe-area-inset-bottom));
          z-index: 25;
          height: 56px;
          box-shadow: 0 -10px 40px -10px rgb(0 0 0 / 70%);
          background: var(--bg-2);
        }
        .row.active .composer kbd {
          display: none;
        }
        .row.active .composer .btn {
          height: 42px;
          padding: 0 16px;
        }
        .row.active .results {
          top: auto;
          bottom: calc(100% + 8px);
          max-height: 46dvh;
        }
        .row.active::before {
          content: "";
          display: block;
          height: 48px;
          border-radius: 8px;
          border: 1px solid rgb(var(--lit-rgb) / 50%);
          background: rgb(var(--lit-rgb) / 5%);
        }
        .legend {
          font-size: 12px;
          gap: 12px;
        }

        .sheet {
          grid-template-columns: 1fr;
          border-radius: 22px;
        }
        .sheet-art {
          min-height: 230px;
          border-radius: 22px 22px 0 0;
        }
        .sheet-body {
          padding: 20px;
        }
        .sheet-body h2 {
          font-size: 28px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          transition-duration: 0.01ms !important;
        }
        .flies {
          display: none;
        }
      }
    </style>
  </head>

          {

          },
          {

            en: "Gilgamesh",
            al: ["ji er jia mei shen", "jierjiameishen", "gilgamesh"],

          {

            el: "quantum",

          },
          {
            id: "aventurine-waveflair",
            zh: "砂金•戏浪",
            en: "Aventurine • Waveflair",
            al: ["sha jin xi lang", "shajinxilang", "aventurine waveflair", "aventurinewaveflair"],
            el: "quantum",
            path: "elation",
            r: 5,
            fac: "ipc",
            facg: "ipc",
            reg: "cosmic",
            v: "4.5",
            av: "/assets/characters/aventurine-waveflair-avatar-065d75ab338c.png",
            oid: "1513",
            pt: false,
          },
          {
            id: "robin-summeretto",
            zh: "知更鸟•晴歌",
            en: "Robin • Summeretto",
            al: [
              "zhi geng niao qing ge",
              "zhigengniaoqingge",
              "robin summeretto",
              "robinsummeretto",
            ],
            el: "wind",
            path: "remembrance",
            r: 5,
            fac: "penacony",
            facg: "penacony",
            reg: "penacony",
            v: "4.5",
            av: "/assets/characters/robin-summeretto-avatar-13163e99fe13.png",
            oid: "1512",
            pt: false,
          },
        ],
        names: {
          "stellaron-hunters": "星核猎手",
          "xianzhou-luofu": "仙舟「罗浮」",
          ipc: "星际和平公司",
          "xianzhou-yaoqing": "仙舟「曜青」",
          "intelligentsia-guild": "博识学会",
          "galaxy-rangers": "巡海游侠",
          "xianzhou-yuque": "仙舟「玉阙」",
          belobog: "贝洛伯格",
          "self-annihilators": "自灭者",
          "herta-space-station": "空间站「黑塔」",
          amphoreus: "翁法罗斯",
          planarcadia: "二相乐园",
          "astral-express": "星穹列车",
          "garden-of-recollection": "流光忆庭",
          "another-world": "异界",
          xianzhou: "仙舟",
          "the-cremators": "焚化工",
          "xianzhou-zhuming": "仙舟「朱明」",
          "knights-of-beauty": "纯美骑士团",
          cosmic: "银河",
          penacony: "匹诺康尼",
          "fate-stay-night": "异界(Fate系列)",
          "masked-fools": "假面愚者",
        },
      };
      const ASSET = "../../../apps/web/public";
      const EL = {
        physical: "物理",
        fire: "火",
        ice: "冰",
        lightning: "雷",
        wind: "风",
        quantum: "量子",
        imaginary: "虚数",
      };
      const PATH = {
        destruction: "毁灭",
        hunt: "巡猎",
        erudition: "智识",
        harmony: "同谐",
        nihility: "虚无",
        preservation: "存护",
        abundance: "丰饶",
        remembrance: "记忆",
        elation: "欢愉",
      };
      const FAC = Object.assign({}, DATA.names);
      const chars = DATA.chars;
      const byId = Object.fromEntries(chars.map((c) => [c.id, c]));
      const $ = (s, r = document) => r.querySelector(s);
      const av = (c) => ASSET + c.av;
      const portrait = (c) => (c.pt ? `${ASSET}/assets/portraits/${c.oid}.png` : av(c));
      const MAX = 6;
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* ---------- hub ---------- */
      document.querySelectorAll("[data-av]").forEach((img) => (img.src = av(byId[img.dataset.av])));
      const y = byId.firefly;
      $("#yImg").src = portrait(y);
      $("#yName").textContent = y.zh;

      const more = [
        ["周赛", "本周：货币战争 · 5 题全服同序", "剩 3 天", "aventurine", "live"],
        ["实时对战", "随机匹配计 Elo，好友房可选 BO1–BO7", "Elo 1000", "acheron", ""],
        ["立绘挑战", "从局部立绘认出角色", "新", "sparkle", ""],
        ["货币战争", "费用、站位、羁绊三项判题", "可离线", "silver-wolf", ""],
        ["星神", "从遮罩图像认出星神", "需联网一次", "the-herta", ""],
      ];
      $("#moreList").innerHTML = more
        .map(([t, d, s, img, cls]) => {
          const c = byId[img] || chars[0];
          return `<a href="#"><span class="thumb"><img src="${av(c)}" alt="" loading="lazy"></span><span><strong>${t}</strong><small>${d}</small></span><span class="chip ${cls}">${s}</span><span class="arrow"><svg><use href="#i-arrow"/></svg></span></a>`;
        })
        .join("");

      const week = [
        ["一", "won", "3/6", "mmcc,ecem,eeeeee"],
        ["二", "won", "5/6", ""],
        ["三", "lost", "X/6", ""],
        ["四", "won", "2/6", ""],
        ["五", "won", "4/6", ""],
        ["六", "today", "—", ""],
        ["日", "", "", ""],
      ];
      const bars = {
        "3/6": "mmcecm",
        "5/6": "eemecm",
        "X/6": "mmmmmm",
        "2/6": "eceeme",
        "4/6": "eeecee",
      };
      $("#week").innerHTML = week
        .map(([d, st, r]) => {
          const b = (bars[r] || "......")
            .split("")
            .map((x) => `<i class="${x}"></i>`)
            .join("");
          return `<div class="day ${st === "today" ? "is-today" : st}"><div class="label"><span>周${d}</span><span>${st === "today" ? "今天" : ""}</span></div><div class="res num">${r || "&nbsp;"}</div><div class="bar">${b}</div></div>`;
        })
        .join("");

      function tickCountdown() {
        const now = Date.now(),
          s = new Date(now + 8 * 3600e3);
        const next = Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), s.getUTCDate() + 1) - 8 * 3600e3;
        const t = Math.floor((next - now) / 1000);
        $("#countdown").textContent = [t / 3600, (t % 3600) / 60, t % 60]
          .map((v) => String(Math.floor(v)).padStart(2, "0"))
          .join(":");
      }
      tickCountdown();
      setInterval(tickCountdown, 1000);

      /* ---------- game ---------- */
      let answer = byId.robin,
        guesses = [],
        startedAt = null,
        done = false,
        timerId;
      const vnum = (v) => parseFloat(v);
      function judge(g) {
        const a = answer;
        const eq = (k) => (g[k] === a[k] ? "exact" : "miss");
        const fac = g.fac === a.fac ? "exact" : g.facg === a.facg ? "close" : "miss";
        let ver = "miss",
          dir = "";
        if (g.v === a.v) ver = "exact";
        else {
          if (Math.floor(vnum(g.v)) === Math.floor(vnum(a.v))) ver = "close";
          dir = vnum(a.v) > vnum(g.v) ? "↑" : "↓";
        }
        return [
          [EL[g.el], eq("el")],
          [PATH[g.path], eq("path")],
          [g.r + "★", eq("r")],
          [FAC[g.fac] || g.fac, fac],
          [FAC[g.reg] || g.reg, eq("reg")],
          [g.v, ver, dir],
        ];
      }

      function renderPips() {
        const won = done && guesses.at(-1) === answer;
        $("#pips").innerHTML = Array.from(
          { length: MAX },
          (_, i) =>
            `<i class="${i < guesses.length ? (won && i === guesses.length - 1 ? "win" : "used") : ""}"></i>`,
        ).join("");
      }

      function rowHTML(g, cls = "") {
        const cells = judge(g)
          .map(
            ([v, s, d], i) =>
              `<div class="tile" role="gridcell" data-s="${s}" style="--i:${i}"><span class="v">${v}${d ? `<span class="dir">${d}</span>` : ""}</span></div>`,
          )
          .join("");
        return `<div class="row ${cls}" role="row"><div class="who"><img src="${av(g)}" alt=""><div><b>${g.zh}</b><small>${g.en}</small></div></div>${cells}</div>`;
      }

      function renderBoard(animateLast = false) {
        const head = $(".board-head").outerHTML;
        let html = head;
        guesses.forEach((g, i) => {
          const last = i === guesses.length - 1;
          const win = last && g === answer;
          html += rowHTML(g, animateLast && last ? "reveal" + (win ? " win" : "") : "");
        });
        if (!done) {
          html += `<div class="row active" role="row"><div class="composer">
      <svg><use href="#i-search"/></svg>
      <input id="q" type="search" role="combobox" aria-expanded="false" aria-controls="res" autocomplete="off" placeholder="第 ${guesses.length + 1} 猜：输入角色名、英文或拼音" />
      <kbd>Enter</kbd>
      <button class="btn btn-primary" id="go">猜</button>
      <div class="results" id="res" role="listbox" hidden></div></div></div>`;
        }
        for (let i = guesses.length + (done ? 0 : 1); i < MAX; i++) {
          html += `<div class="row empty" aria-hidden="true">${'<div class="slot"></div>'.repeat(7)}</div>`;
        }
        $("#board").innerHTML = html;
        renderPips();
        if (!done) wireComposer();
      }

      let hl = 0,
        results = [];
      function search(q) {
        q = q.trim().toLowerCase();
        if (!q) return [];
        const used = new Set(guesses.map((g) => g.id));
        const score = (c) => {
          const n = c.zh.toLowerCase(),
            e = c.en.toLowerCase();
          if (n === q || e === q) return 0;
          if (n.startsWith(q) || e.startsWith(q)) return 1;
          if (c.al.some((a) => a.replace(/\s/g, "").startsWith(q.replace(/\s/g, "")))) return 2;
          if (n.includes(q) || e.includes(q)) return 3;
          return 9;
        };
        return chars
          .map((c) => [score(c), c])
          .filter(([s]) => s < 9)
          .sort((a, b) => a[0] - b[0])
          .slice(0, 8)
          .map(([, c]) => ({ c, used: used.has(c.id) }));
      }
      function wireComposer() {
        const q = $("#q"),
          res = $("#res");
        const draw = () => {
          results = search(q.value);
          res.hidden = !results.length;
          q.setAttribute("aria-expanded", String(!res.hidden));
          res.innerHTML = results
            .map(
              ({ c, used }, i) =>
                `<button role="option" aria-selected="${i === hl}" class="${used ? "used" : ""}" data-id="${c.id}"><img src="${av(c)}" alt=""><span><b>${c.zh}</b><small>${c.en}${used ? " · 已猜过" : ""}</small></span></button>`,
            )
            .join("");
        };
        q.addEventListener("input", () => {
          hl = 0;
          draw();
        });
        q.addEventListener("keydown", (e) => {
          if (e.key === "ArrowDown") {
            e.preventDefault();
            hl = Math.min(hl + 1, results.length - 1);
            draw();
          }
          if (e.key === "ArrowUp") {
            e.preventDefault();
            hl = Math.max(hl - 1, 0);
            draw();
          }
          if (e.key === "Enter") {
            e.preventDefault();
            pick(results[hl]?.c);
          }
          if (e.key === "Escape") {
            res.hidden = true;
          }
        });
        res.addEventListener("mousedown", (e) => e.preventDefault());
        res.addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (b) pick(byId[b.dataset.id]);
        });
        $("#go").addEventListener("click", () => pick(results[hl]?.c));
        if (!matchMedia("(max-width: 760px)").matches) q.focus({ preventScroll: true });
      }

      function pick(c) {
        if (!c || done) return;
        if (guesses.includes(c)) {
          const r = $(".row.active");
          r.classList.remove("shake");
          void r.offsetWidth;
          r.classList.add("shake");
          return;
        }
        if (!startedAt) {
          startedAt = Date.now();
          timerId = setInterval(tick, 1000);
        }
        guesses.push(c);
        const won = c === answer;
        if (won || guesses.length >= MAX) {
          done = true;
          clearInterval(timerId);
        }
        renderBoard(true);
        $("#live").textContent =
          `${c.zh}：` +
          judge(c)
            .map(([v, s]) => `${v}${s === "exact" ? "一致" : s === "close" ? "接近" : "不符"}`)
            .join("，");
        if (done) setTimeout(() => showResult(won), reduce ? 200 : 6 * 110 + 1300);
      }
      function tick() {
        const t = Math.floor((Date.now() - startedAt) / 1000);
        $("#timer").textContent =
          `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
      }

      function showResult(won) {
        const grid = guesses
          .map(
            (g) =>
              `<div>${judge(g)
                .map(([, s]) => `<i class="${s === "exact" ? "e" : s === "close" ? "c" : ""}"></i>`)
                .join("")}</div>`,
          )
          .join("");
        // funnel = remaining candidates after each guess (consistent with judge)
        let pool = chars.slice();
        const steps = [["开局", pool.length]];
        guesses.forEach((g, i) => {
          const sig = JSON.stringify(judge(g).map(([, s, d]) => s + (d || "")));
          const saved = answer;
          pool = pool.filter((cand) => {
            answer = cand;
            const ok = JSON.stringify(judge(g).map(([, s, d]) => s + (d || ""))) === sig;
            answer = saved;
            return ok;
          });
          steps.push([`第 ${i + 1} 猜`, pool.length]);
        });
        const max = steps[0][1];
        const funnel = steps
          .map(
            ([l, n], i) =>
              `<div class="funnel-row ${i === steps.length - 1 ? "last" : ""}"><span>${l}</span><span class="track"><i style="width:${Math.max(3, (n / max) * 100)}%;animation-delay:${i * 120}ms"></i></span><span class="num">${n}</span></div>`,
          )
          .join("");
        $("#resultRoot").innerHTML =
          `<div class="scrim" role="dialog" aria-modal="true" aria-labelledby="rh">
    <div class="sheet" style="position:relative">
      <figure class="sheet-art" style="margin:0"><img src="${portrait(answer)}" alt=""><figcaption><span class="label">今日答案</span><strong>${answer.zh}</strong></figcaption></figure>
      <div class="sheet-body">
        <div>
          <span class="label">每日 #312 · 用时 <span class="num">${$("#timer").textContent}</span></span>
          <h2 id="rh">${won ? `第 <em>${guesses.length}</em> 次猜中` : "这次没猜到"}</h2>
        </div>
        <div style="display:flex;gap:26px;align-items:start;flex-wrap:wrap">
          <div class="share-grid" aria-label="结果图">${grid}</div>
          <div class="funnel" style="flex:1;min-width:220px"><span class="label">推理复盘 · 每一猜后剩余候选</span>${funnel}</div>
        </div>
        <div class="stats">
          <div><span class="label">连胜</span><strong class="num">8</strong></div>
          <div><span class="label">胜率</span><strong class="num">86%</strong></div>
          <div><span class="label">超过玩家</span><strong class="num">72%</strong></div>
        </div>
        <div class="actions">
          <button class="btn btn-primary"><svg><use href="#i-share"/></svg>分享结果</button>
          <button class="btn">发起好友挑战</button>
          <button class="btn" data-go="hub">回到总站</button>
        </div>
      </div>
      <button class="icon-btn close" aria-label="关闭" id="closeRes"><svg><use href="#i-x"/></svg></button>
    </div></div>`;
        $("#closeRes").onclick = () => ($("#resultRoot").innerHTML = "");
        bindGo($("#resultRoot"));
        if (won && !reduce) {
          $("#flies").innerHTML = Array.from({ length: 22 }, () => {
            const l = Math.random() * 100,
              d = 3.5 + Math.random() * 3,
              dl = Math.random() * 1.6,
              x = (Math.random() - 0.5) * 160;
            return `<i style="left:${l}%;--d:${d}s;--delay:${dl}s;--x:${x}px;transform:scale(${0.5 + Math.random()})"></i>`;
          }).join("");
          setTimeout(() => ($("#flies").innerHTML = ""), 8000);
        }
      }

      function reset() {
        guesses = [];
        done = false;
        startedAt = null;
        clearInterval(timerId);
        $("#timer").textContent = "00:00";
        $("#resultRoot").innerHTML = "";
        renderBoard();
      }

      /* ---------- views / theme ---------- */
      function go(v) {
        $("#view-hub").hidden = v !== "hub";
        $("#view-game").hidden = v !== "game";
        document
          .querySelectorAll(".proto-bar [data-go]")
          .forEach((b) => b.classList.toggle("on", b.dataset.go === v));
        if (v === "game" && !guesses.length) reset();
        if (v === "hub") $("#resultRoot").innerHTML = "";
        scrollTo(0, 0);
      }
      function bindGo(root) {
        root.querySelectorAll("[data-go]").forEach((el) =>
          el.addEventListener("click", (e) => {
            e.preventDefault();
            go(el.dataset.go);
          }),
        );
      }
      bindGo(document);
      const toggleTheme = () =>
        (document.documentElement.dataset.theme =
          document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      $("#themeBtn").onclick = toggleTheme;
      $("#themeBtn2").onclick = toggleTheme;
      async function demo() {
        go("game");
        reset();
        for (const id of ["kafka", "sparkle", "robin"]) {
          await new Promise((r) => setTimeout(r, reduce ? 50 : 1100));
          pick(byId[id]);
        }
      }
      $("#demoBtn").onclick = demo;

      const params = new URLSearchParams(location.search);
      if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
      if (params.get("view") === "game") {
        go("game");
        if (params.get("demo")) demo();
      } else if (params.get("demo")) demo();
    </script>
  </body>
</html>
